@if (this.majorSelected.major()) {
  <div class="max-w-4xl mx-auto">
      <h2 class="text-2xl font-semibold text-center text-gray-800 dark:text-gray-200 mb-6">
        {{ major }} Grade Calculator
      </h2>
      <div class="mb-6 flex justify-center space-x-4">
        <button
          *ngFor="let semester of majors[major]"
          (click)="handleSemesterChange(semester.id)"
          [ngClass]="{
            'bg-blue-500 text-white': selectedSemester === semester.id,
            'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200': selectedSemester !== semester.id
          }"
          class="px-4 py-2 rounded-md"
        >
          {{ semester.name }}
        </button>
        <button
          (click)="handleSemesterChange('total')"
          [ngClass]="{
            'bg-blue-500 text-white': selectedSemester === 'total',
            'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200': selectedSemester !== 'total'
          }"
          class="px-4 py-2 rounded-md"
        >
          Total
        </button>
      </div>
      <div *ngIf="selectedSemester === 'total' && major !== 'bio-chem' " class="mb-4 flex justify-center items-center space-x-4">
     
        <div class="radio-inputs dark:bg-slate-700">
          <label class="radio">
            <input type="radio" name="radio" checked="">
            <span class="name">MIS</span>
          </label>
          <label class="radio">
            <input type="radio" name="radio">
            <span class="name">Pe</span>
          </label>
        </div>
      </div>
      
      
      <div *ngFor="let semester of majors[major]" [hidden]="selectedSemester !== 'total' && selectedSemester !== semester.id" class="mb-8">
        <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-300 mb-4">
          {{ semester.name }}
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div *ngFor="let course of semester.courses" class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-md">
            <label [for]="course.id" class="block text-gray-700 dark:text-gray-200 mb-2">
              {{ course.name }} ({{ course.credits }} credits)
            </label>
            <input
              type="text"
              [id]="course.id"
              minlength="1"
              maxlength="2"
              min="0"
              max="100"
              class="input-grade w-full px-3 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter grade (0-100)"
              [(ngModel)]="grades[course.id]"
              (ngModelChange)="handleGradeChange(course.id, $event)"
              [disabled]="selectedSemester === 'total' && ((isMIS && semester.id === 'sem2-pe') || (!isMIS && semester.id === 'sem2-mis'))"
            >
          </div>
        </div>
      </div>
     
  
      <div class="flex justify-center mt-8 space-x-4">
        <button
          (click)="calculateGrade()"
          [disabled]="!isFormValid()"
          [class.cursor-not-allowed]="!isFormValid()"
          class="bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-600 transition-colors duration-300"
        >
          Calculate Grade
        </button>
        <button
          (click)="onReset()"
          class="bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-gray-400 dark:hover:bg-gray-500 transition-colors duration-300"
        >
          Change Major
        </button>
      </div>
      
      
      <div *ngIf="result !== null" class="mt-8 text-center">
        <h3 class="text-2xl font-semibold text-blue-700 dark:text-blue-300 mb-2">
          Your Average Grade
        </h3>
        <p class="text-4xl font-bold text-gray-800 dark:text-gray-200">{{ result }}</p>
      </div>
    </div>
    
}
