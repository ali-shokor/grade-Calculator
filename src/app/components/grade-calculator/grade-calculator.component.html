<div *ngIf="majorSelected.major()" class="max-w-4xl mx-auto px-4">
  <h2 class="text-2xl font-semibold text-center text-gray-800 dark:text-gray-200 mb-6">
    {{ major | uppercase }} Grade Calculator
  </h2>
  
  <!-- Semester selection buttons -->
  <div class="mb-6">
    <div class="grid grid-cols-2 sm:grid-cols-3 text-center md:grid-cols-4 gap-4">
      <button
        *ngFor="let semester of majors[major]"
        (click)="handleSemesterChange(semester.id)"
        [ngClass]="{
          'bg-blue-500 text-white': selectedSemester === semester.id,
          'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200': selectedSemester !== semester.id
        }"
        class="px-4 py-2 rounded-md text-sm sm:text-base transition-colors duration-300 hover:bg-blue-600 hover:text-white"
      >

     {{ semester.name }}
      </button>
      <button
        (click)="handleSemesterChange('total')"
        [ngClass]="{
          'bg-blue-500 text-white': selectedSemester === 'total',
          'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200': selectedSemester !== 'total'
        }"
        class="px-4 py-2 rounded-md text-sm sm:text-base transition-colors duration-300 hover:bg-blue-600 hover:text-white"
      >
        Total
      </button>
    </div>
  </div>
  
  <!-- MIS/PE selection for MISPC major -->
  <div *ngIf="selectedSemester === 'total' && major !== 'csvt'" class="mb-6 flex justify-center">
    <div class="radio-inputs dark:bg-slate-700 p-1 rounded-lg">
      <label class="radio inline-flex items-center mr-4 cursor-pointer">
        <input type="radio" name="misPeOption" [value]="true" [(ngModel)]="isMIS" class="hidden">
        <span class="name px-3 py-2 rounded-md" [ngClass]="{'bg-blue-500 text-white': isMIS, 'text-gray-700 dark:text-gray-200': !isMIS}">MIS</span>
      </label>
      <label class="radio inline-flex items-center cursor-pointer">
        <input type="radio" name="misPeOption" [value]="false" [(ngModel)]="isMIS" class="hidden">
        <span class="name px-3 py-2 rounded-md" [ngClass]="{'bg-blue-500 text-white': !isMIS, 'text-gray-700 dark:text-gray-200': isMIS}">PE</span>
      </label>
    </div>
  </div>
  
  <!-- Course inputs -->
  <div *ngFor="let semester of majors[major]" [hidden]="selectedSemester !== 'total' && selectedSemester !== semester.id" class="mb-8">
    @if (selectedSemester === 'total') {

      @if (isMIS) {
        @if (semester.id !== 'sem2-pe') {   
          <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-300 mb-4">
            {{ semester.name }}
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div *ngFor="let course of semester.courses" class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-md">
              <label [for]="course.id" class="block text-gray-700 dark:text-gray-200 mb-2">
                {{ course.name }} ({{ course.credits }} credits)
              </label>
              <input
                type="text"
                [id]="course.id"
                minlength="1"
                maxlength="3"
                min="0"
                max="100"
                class="input-grade w-full px-3 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter grade (0-100)"
                [(ngModel)]="grades[course.id]"
                (ngModelChange)="handleGradeChange(course.id, $event)"
              >
            </div>
          </div>
        }
      }
      @else {
        @if (semester.id !== 'sem2-mis') {
          <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-300 mb-4">
            {{ semester.name }}
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div *ngFor="let course of semester.courses" class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-md">
              <label [for]="course.id" class="block text-gray-700 dark:text-gray-200 mb-2">
                {{ course.name }} ({{ course.credits }} credits)
              </label>
              <input
                type="text"
                [id]="course.id"
                minlength="1"
                maxlength="3"
                min="0"
                max="100"
                class="input-grade w-full px-3 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Enter grade (0-100)"
                [(ngModel)]="grades[course.id]"
                (ngModelChange)="handleGradeChange(course.id, $event)"
              >
            </div>
          </div>
        }
      }
    }
    @else {
      <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-300 mb-4">
        {{ semester.name }}
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let course of semester.courses" class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-md">
          <label [for]="course.id" class="block text-gray-700 dark:text-gray-200 mb-2">
            {{ course.name }} ({{ course.credits }} credits)
          </label>
          <input
            type="text"
            [id]="course.id"
            minlength="1"
            maxlength="3"
            min="0"
            max="100"
            class="input-grade w-full px-3 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter grade (0-100)"
            [(ngModel)]="grades[course.id]"
            (ngModelChange)="handleGradeChange(course.id, $event)"
          >
        </div>
      </div>
    }
    
  </div>
  
  <!-- Action buttons -->
  <div class="flex flex-col sm:flex-row justify-center mt-8 space-y-4 sm:space-y-0 sm:space-x-4">
    <button
      (click)="calculateGrade()"
      [disabled]="!isFormValid()"
      [ngClass]="{'opacity-50 cursor-not-allowed': !isFormValid(), 'hover:bg-blue-600': isFormValid()}"
      class="bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors duration-300"
    >
      Calculate Grade
    </button>
    <button
      (click)="onReset()"
      class="bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-gray-400 dark:hover:bg-gray-500 transition-colors duration-300"
    >
      Change Major
    </button>
  </div>
  
  <!-- Result display -->
  <div *ngIf="result !== null" class="mt-8 text-center">
    <h3 class="text-2xl font-semibold text-blue-700 dark:text-blue-300 mb-2">
      Your Average Grade
    </h3>
    <p class="text-4xl font-bold text-gray-800 dark:text-gray-200">{{ result }}</p>
    <!--  number: '1.2-2' -->
  </div>
</div>
