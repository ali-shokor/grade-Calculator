@if (!this.majorSelected.major()) {

  <div class="max-w-md mx-auto">
      <h2 class="text-2xl font-semibold text-center text-blue-700 dark:text-gray-200 mb-6 transition-all duration-500">
        Select Your Major
      </h2>
      <div class="grid grid-cols-1 gap-4">
          @for (major of majors; track major) {
              <button
                (click)="onSelectMajor(major.id)"
                class="shadow__btn  text-blue-600 bg-white dark:bg-gray-700 hover:text-white dark:text-white font-semibold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-300"
              >
                {{ major.name }}
              </button>
          }
      </div>
    </div>
    
}
