<div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md my-10 mb-20 transition-all duration-200">
  <h2 class="text-2xl font-semibold text-center text-gray-800 dark:text-gray-200 mb-6">
    User Profile
  </h2>
  <div class="mb-6">
    <!-- <p class="text-gray-600 dark:text-gray-400">Email: {{ userService.user?.email }}</p> -->
    @if (!isEditing) {
        <div class="flex items-center justify-between mt-2">
          <p class="text-gray-600 dark:text-gray-400">Name: {{ userService.user?.name }}</p>
          <button
            (click)="startEditing()"
            class=" py-2 px-4 rounded-lg dark:bg-slate-900 bg-slate-500 ml-2 text-white dark:text-blue-500 hover:text-slate-300 dark:hover:text-blue-600"
          >
            Edit
          </button>
        </div>
    }
    @else {
        <div class="mt-2">
          <input
            type="text"
            maxlength="10"
            [minlength]="3"
            [(ngModel)]="editedName"
            class="w-full px-3 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
           <button
            (click)="handleSave()"
            class="mt-2 bg-blue-500 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-600 transition-colors duration-300"
          >
            Save
          </button>
        </div>
        }
   </div>
   
  <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-4">Grades</h3>
  @if (userService.grades.length) {

      <ul class="space-y-2">
        @for (grade of userService.grades; track grade) {
            
            <li class="flex justify-between items-center">
              <span class="text-gray-600 dark:text-gray-400">
                {{ grade.semester }}: {{ grade.grade.toFixed(2) }}
              </span>
              <button
                (click)="handleDeleteGrade(grade.semester)"
                class="text-red-500 hover:text-red-600"
              >
                Delete
              </button>
            </li>
        }
      </ul>
  }
  @else {
      <p class="text-gray-600 dark:text-gray-400">No grades saved yet.</p>
  }

  <button
    (click)="toggleProfile()"
    class="mt-8 w-full bg-red-500 text-white font-semibold py-2 px-4 rounded-md hover:bg-red-600 transition-colors duration-300"
  >
    BACK
  </button>
